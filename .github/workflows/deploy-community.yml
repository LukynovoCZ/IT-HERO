name: Nasadit komunitní databázi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud-api/deploy-request.json]
permissions:
  contents: write
concurrency:
  group: it-hero-community-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0e90e8eadd6238a7f6b31057c00a7f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IT_HERO_ADMIN_TOKEN: ${{ secrets.IT_HERO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Nasadit schránku hlášek
        id: cloudflare
        run: node scripts/deploy_community.mjs
      - name: Připojit ověřené API do hry
        env:
          COMMUNITY_API_URL: ${{ steps.cloudflare.outputs.api_url }}
        run: |
          node scripts/connect_community.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-config.js dialogue-suggestions.html dialogue-admin.html cloud-api/deployment.json
          if ! git diff --cached --quiet; then
            git commit -m "Connect verified community API"
            git push origin HEAD:main
          fi
