name: Publish neutral game copy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.ico'
      - site.webmanifest
      - assets/**
      - vendor/**
      - cloud-api/public-copy-request.json
      - cloud-api/worker.mjs
      - cloud-api/character-groups.mjs
      - cloud-api/avatar-ids.mjs
      - scripts/build_public_copy.mjs
      - scripts/deploy_public_copy.mjs
      - .github/workflows/publish-neutral-copy.yml
permissions:
  contents: write
concurrency:
  group: public-game-copy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0e90e8eadd6238a7f6b31057c00a7f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IT_HERO_ADMIN_TOKEN: ${{ secrets.IT_HERO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish clean copy with same-origin API
        run: node scripts/deploy_public_copy.mjs
      - name: Save encrypted deployment receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-api/public-copy-receipt.json
          git commit -m "Record verified neutral deployment (encrypted address)"
          git pull --rebase origin main
          git push origin HEAD:main
