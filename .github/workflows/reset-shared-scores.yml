name: Reset shared Hall of Fame
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud-api/score-reset-request.json]
permissions:
  contents: read
concurrency:
  group: shared-score-reset
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0e90e8eadd6238a7f6b31057c00a7f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reset once and verify the single requested record
        run: node scripts/reset_shared_scores.mjs
